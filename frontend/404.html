<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — PromoSlot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#14273f; --mut:#5f6e85; --faint:#8291a6;
  --line:#d9dfe8;
  --acc:#4f46e5; --acc2:#4338ca; --acc-soft:#eef2ff; --acc-border:#c7d2fe;
  --navy:#14273f; --navy-sub:#c4cfde; --navy-acc:#a5b4fc;
  --r:16px;
  --font-d:"Newsreader",serif;
  --font-b:"Archivo",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-b);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--acc);text-decoration:none}
a:hover{color:var(--acc2);text-decoration:underline}
.nf-nav{background:var(--navy);color:var(--navy-sub);padding:18px 20px}
.nf-nav-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:19px;color:#fff;letter-spacing:-.02em}
.nf-logo-mark{width:31px;height:31px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.nf-main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 20px}
.nf-card{max-width:520px;text-align:center}
.nf-code{font-family:var(--font-d);font-size:15px;font-weight:600;color:var(--acc);letter-spacing:.06em;margin-bottom:14px}
.nf-title{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.nf-sub{color:var(--mut);font-size:15.5px;margin-bottom:30px}
.nf-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nf-btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:10px;font-size:14.5px;font-weight:600;text-decoration:none;transition:background-color .15s,color .15s}
.nf-btn-primary{background:var(--acc);color:#fff}
.nf-btn-primary:hover{background:var(--acc2);color:#fff;text-decoration:none}
.nf-btn-o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.nf-btn-o:hover{background:var(--acc-soft);color:var(--ink);text-decoration:none}
.nf-foot{padding:24px 20px;text-align:center;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<div class="nf-nav"><div class="nf-nav-in"><span class="nf-logo-mark">P</span>PromoSlot</div></div>
<main class="nf-main">
  <div class="nf-card">
    <div class="nf-code">404</div>
    <h1 class="nf-title">That page doesn't exist</h1>
    <p class="nf-sub">The link might be old, or the page may have moved. Here's how to get back on track.</p>
    <div class="nf-actions">
      <a class="nf-btn nf-btn-primary" href="/">Go to homepage</a>
      <a class="nf-btn nf-btn-o" href="/marketplace">Browse marketplace</a>
      <a class="nf-btn nf-btn-o" href="mailto:support@usepromoslot.com">Contact support</a>
    </div>
  </div>
</main>
<div class="nf-foot">PromoSlot</div>
</body>
</html>
